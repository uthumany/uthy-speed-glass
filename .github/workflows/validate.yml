name: Validate and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js for deterministic tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip python3
      - name: Run validation suite
        run: bash scripts/validate.sh
      - name: Build installable extension ZIP
        run: bash scripts/package.sh
      - name: Build full source archive
        run: bash scripts/package-source.sh
      - name: Upload extension and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uthy-speed-glass-${{ github.sha }}
          path: |
            dist/uthy-speed-glass@uthy.zip
            dist/uthy-speed-glass@uthy.zip.sha256
            dist/uthy-speed-glass-source-*.zip
            dist/uthy-speed-glass-source-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uthy-speed-glass-${{ github.sha }}
          path: dist
      - name: Verify tag, version, and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("metadata.json", encoding="utf-8"))["version-name"])')"
          test "$RELEASE_TAG" = "v$VERSION"
          (cd dist && sha256sum --check uthy-speed-glass@uthy.zip.sha256)
          (cd dist && for checksum in uthy-speed-glass-source-*.zip.sha256; do sha256sum --check "$checksum"; done)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Uthy Speed Glass ${{ github.ref_name }}.

            Declared support: GNOME Shell 45–50. Review the project test report for target-desktop validation status and known limitations before installation.
          files: |
            dist/uthy-speed-glass@uthy.zip
            dist/uthy-speed-glass@uthy.zip.sha256
            dist/uthy-speed-glass-source-*.zip
            dist/uthy-speed-glass-source-*.zip.sha256
